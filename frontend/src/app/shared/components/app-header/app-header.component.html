<header class="border-b border-gray-200 bg-surface shadow-sm">
  <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4 sm:px-6">
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="rounded p-1 text-gray-600 hover:bg-gray-100 lg:hidden"
        aria-label="Menu"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <span class="text-lg font-bold tracking-wide text-gray-900">CONSTRUCHECK</span>
    </div>

    @if (showUserMenu()) {
      <div class="relative">
        <button
          type="button"
          (click)="toggleMenu()"
          class="flex items-center gap-1 rounded-full p-1 hover:bg-gray-100"
          aria-label="Menu do usuário"
        >
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-200 text-gray-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        @if (menuOpen() && isAuthenticated()) {
          <div class="absolute right-0 z-20 mt-2 w-48 rounded-md border border-gray-200 bg-white py-1 shadow-lg">
            <p class="truncate px-4 py-2 text-xs text-gray-500">{{ currentUser()?.email }}</p>
            <button
              type="button"
              (click)="logout()"
              class="block w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-50"
            >
              Sair
            </button>
          </div>
        }
      </div>
    }
  </div>
</header>
