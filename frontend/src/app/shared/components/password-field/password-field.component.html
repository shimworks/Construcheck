<div class="mb-4">
  <label [for]="inputId()" class="mb-1 block text-sm font-medium text-gray-800">
    {{ label() }}
  </label>
  <div class="relative">
    <input
      [id]="inputId()"
      [type]="showPassword ? 'text' : 'password'"
      [placeholder]="placeholder()"
      [formControl]="$any(control())"
      class="w-full rounded-md border border-gray-300 px-3 py-2 pr-10 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
    />
    <button
      type="button"
      (click)="toggleVisibility()"
      class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
      [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
    >
      @if (showPassword) {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-5 0-9-4-9-7s4-7 9-7c1.1 0 2.15.2 3.125.575M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      }
    </button>
  </div>
  @if (errorMessage(); as message) {
    <p class="mt-1 text-xs text-red-600">{{ message }}</p>
  }
</div>
